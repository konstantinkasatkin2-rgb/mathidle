<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Math Idle — проверка аккаунтов</title>
<style>
  body { background:#0d111a; color:#e8edf5; font: 13px/1.6 system-ui, sans-serif; margin: 0; padding: 16px; }
  #out { font: 12px/1.7 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  .ok { color:#48bb78; }
  .bad { color:#f56565; }
</style>
</head>
<body>
<h1>Math Idle — регистрация, вход и сообщения об ошибках</h1>
<pre id="out">загрузка…</pre>

<script>
// Проверяет, что игрок получает внятные сообщения, а не технические
// «Failed to fetch». Страницу открывает tools/account_check.sh, она же
// подставляет порт сервера и сценарий.
//
//   ?port=8766&mode=up     сервер запущен: регистрация, вход, ошибки сервера
//   ?port=9999&mode=down   сервер не запущен: понятное объяснение
//   ?mode=native           мост приложения Android: сервер найден сам
var params = new URLSearchParams(location.search);
var PORT = params.get("port") || "8766";
var MODE = params.get("mode") || "up";
var URL_ = "http://127.0.0.1:" + PORT;
var USER = "igrok-" + Date.now().toString().slice(-6);

var out = document.getElementById("out");
var failures = 0;

function log(text, ok) {
  if (ok === false) failures++;
  out.textContent += (ok === false ? "  FAIL " : ok === true ? "  ok   " : "  ..   ") + text + "\n";
}

function frameReady(url) {
  return new Promise(function (res) {
    var f = document.createElement("iframe");
    f.width = 900; f.height = 700; f.src = url;
    f.onload = function () { setTimeout(function () { res(f); }, 800); };
    document.body.appendChild(f);
  });
}

/* Ждём либо сообщение об ошибке, либо кнопку «Выйти». */
function waitFor(d, ms) {
  return new Promise(function (res) {
    var t0 = Date.now();
    (function tick() {
      var w = d.querySelector(".warn");
      if (w) return res(w.textContent);
      if (d.querySelector("[data-signout]")) return res("ВЫХОД ВЫПОЛНЕН");
      if (Date.now() - t0 > ms) {
        // показываем, что на самом деле: иначе ошибку нельзя понять
        var panel = d.getElementById("panel");
        var head = panel ? panel.textContent.replace(/\s+/g, " ").slice(0, 120) : "панели нет";
        var view = d.body.className;
        return res("ТАЙМАУТ [" + view + "]: " + head);
      }
      setTimeout(tick, 120);
    })();
  });
}

function pause(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

(async function () {
  var frame = await frameReady("../web/index.html");
  var d = frame.contentDocument;
  var w = frame.contentWindow;

  if (MODE === "native") {
    // Так же устроен мост приложения на Android: игра вызывает
    // MathIdleNative.findServers(), а нативная часть отвечает адресами.
    // В приложении мост есть до старта страницы; здесь ставим его сразу
    // после загрузки — игра несколько раз проверяет его наличие.
    w.MathIdleNative = {
      findServers: function () {
        setTimeout(function () {
          w.MathIdleNativeServers([URL_]);
        }, 120);
      },
    };
    // ждём, пока игра заметит мост (она пробует каждые полсекунды)
    await pause(1200);
    d.querySelector('[data-tab="settings"]').click();
    await pause(400);
    // Жмём «Искать сервер ещё раз» — ровно так поступит игрок, если
    // включил Tailscale, уже запустив игру.
    var search = d.querySelector("[data-find-servers]");
    log("есть кнопка «Искать сервер ещё раз»: " + !!search, !!search);
    if (search) {
      search.click();
      await pause(900);
    }
    // Адрес в поле не главное: игрок мог задать его вручную, и игра не
    // затирает находку. Главное — что сервер найден (это видно в панели
    // строкой «Найдено в сети») и что регистрация по нему проходит, что
    // и проверяет следующий шаг.
    var picked = d.getElementById("serverUrl");
    log("адрес известен игре (найден или задан): " +
        !!(picked && picked.value) ||
        /айдено в сети/.test(d.querySelector("#panel").innerHTML));
    var shown = /айдено в сети/.test(d.querySelector("#panel").innerHTML);
    log("адрес показан в настройках: " + shown, shown);

    d.getElementById("loginName").value = "mob-" + USER + "@mail.ru";
    d.getElementById("loginPass").value = "parol123";
    d.querySelectorAll(".warn").forEach(function (n) { n.remove(); });
    d.querySelector("[data-register]").click();
    var res = await waitFor(d, 15000);
    log("регистрация по найденному адресу: " + res, /ВЫХОД ВЫПОЛНЕН/.test(res));
    var rawFetch = /failed to fetch/i.test(out.textContent);
    log("техническое «Failed to fetch» не показывается: " + !rawFetch, !rawFetch);
    out.className = failures ? "bad" : "ok";
    document.title = failures ? "ACCOUNT-FAIL" : "ACCOUNT-OK";
    return;
  }

  if (MODE === "mail") {
    // Сквозной сценарий: регистрация по почте → письмо с компенсацией →
    // кнопка «Забрать награду» → деньги пришли.
    var EMAIL = "igrok-" + Date.now().toString().slice(-6) + "@mail.ru";
    d.querySelector('[data-tab="settings"]').click();
    await pause(300);
    log("поле просит почту: " +
        (d.getElementById("loginName").type === "email"));
    d.getElementById("serverUrl").value = URL_;
    d.getElementById("loginName").value = EMAIL;
    d.getElementById("loginPass").value = "parol123";
    d.querySelector("[data-register]").click();
    var reg = await waitFor(d, 15000);
    log("регистрация по почте: " + reg, /ВЫХОД ВЫПОЛНЕН/.test(reg));

    var mailTab = d.querySelector('[data-tab="mail"]');
    log("вкладка «Почта» появилась: " + (mailTab && !mailTab.disabled),
        !!(mailTab && !mailTab.disabled));
    mailTab.click();
    await pause(500);
    var html = d.querySelector("#panel").innerHTML;
    log("письмо в ящике: " +
        /Компенсация за утраченный прогресс/.test(html),
        /Компенсация за утраченный прогресс/.test(html));
    log("в письме есть кнопка: " + /Забрать награду/.test(html),
        /Забрать награду/.test(html));

    var before = d.getElementById("money").textContent;
    var claim = d.querySelector("[data-claim]");
    if (!claim) {
      log("кнопка получения найдена", false);
    } else {
      claim.click();
      await pause(1500);
      var after2 = d.getElementById("money").textContent;
      log("деньги после получения: " + before + " -> " + after2,
          before !== after2);
      d.querySelector('[data-tab="mail"]').click();
      await pause(500);
      var html2 = d.querySelector("#panel").innerHTML;
      log("после получения кнопки нет: " + !/Забрать награду/.test(html2),
          !/Забрать награду/.test(html2));
      log("и стоит отметка о получении: " + /Награда получена/.test(html2),
          /Награда получена/.test(html2));
    }
    var raw2 = /failed to fetch/i.test(out.textContent);
    log("техническое «Failed to fetch» не показывается: " + !raw2, !raw2);
    out.className = failures ? "bad" : "ok";
    document.title = failures ? "ACCOUNT-FAIL" : "ACCOUNT-OK";
    return;
  }

  if (MODE === "offline") {
    // Сервера нет — компьютер выключен. Регистрация всё равно обязана
    // работать: аккаунт создаётся на устройстве, письмо с компенсацией
    // приходит сразу, награду можно забрать.
    d.querySelector('[data-tab="settings"]').click();
    await pause(300);
    d.getElementById("loginName").value = "off" + Date.now() + "@mail.ru";
    d.getElementById("loginPass").value = "parol123";
    d.querySelector("[data-register]").click();
    await pause(2500);
    // Аккаунт создан на устройстве: входа на сервер нет, но почта работает
    var mailTab = d.querySelector('[data-tab="mail"]');
    log("вкладка «Почта» открылась: " + (mailTab && !mailTab.disabled),
        !!(mailTab && !mailTab.disabled));
    mailTab.click();
    await pause(500);
    var html = d.querySelector("#panel").innerHTML;
    log("письмо на месте: " +
        /Компенсация за утраченный прогресс/.test(html),
        /Компенсация за утраченный прогресс/.test(html));
    log("помечено «на этом устройстве»: " + /на этом устройстве/.test(html),
        /на этом устройстве/.test(html));
    var before = d.getElementById("money").textContent;
    var claim = d.querySelector("[data-claim]");
    if (!claim) {
      log("кнопка получения найдена", false);
    } else {
      claim.click();
      await pause(800);
      var after = d.getElementById("money").textContent;
      log("деньги сразу на устройстве: " + before + " -> " + after,
          before !== after);
      d.querySelector('[data-tab="mail"]').click();
      await pause(400);
      var gone = !/Забрать награду/.test(d.querySelector("#panel").innerHTML);
      log("кнопки больше нет: " + gone, gone);
    }
    d.querySelector('[data-tab="settings"]').click();
    await pause(400);
    var setHtml = d.querySelector("#panel").innerHTML;
    log("в настройках виден перенос на сервер: " +
        /Перенести на сервер/.test(setHtml), /Перенести на сервер/.test(setHtml));
    // Правило «одна почта — одно письмо»: нажатий сколько угодно,
    // а письмо и награда всё равно одни.
    var EMAIL2 = "farmer-" + Date.now().toString().slice(-6) + "@mail.ru";
    d.querySelector('[data-tab="settings"]').click();
    await pause(300);
    for (var i = 0; i < 5; i++) {
      d.getElementById("serverUrl").value = URL_;
      d.getElementById("loginName").value = EMAIL2;
      d.getElementById("loginPass").value = "parol123";
      d.querySelector("[data-register]").click();
      await pause(700);
    }
    d.querySelector('[data-tab="mail"]').click();
    await pause(500);
    var seen = (d.querySelector("#panel").innerHTML.match(
        /Компенсация за утраченный прогресс/g) || []).length;
    log("пять нажатий «Регистрация» — писем одно: " + (seen === 1), seen === 1);
    var btn2 = d.querySelector("[data-claim]");
    if (btn2) btn2.click();
    await pause(900);
    var money = d.getElementById("money").textContent.trim();
    log("награда начислена один раз: " + money,
        /^100([.,]0+)?$/.test(money));
    out.className = failures ? "bad" : "ok";
    document.title = failures ? "ACCOUNT-FAIL" : "ACCOUNT-OK";
    return;
  }

  d.querySelector('[data-tab="settings"]').click();
  await pause(300);

  function fill(name, pass) {
    d.getElementById("serverUrl").value = URL_;
    d.getElementById("loginName").value = name + "@mail.ru";
    d.getElementById("loginPass").value = pass;
  }
  function click(sel) {
    // убираем прошлое сообщение, иначе ждём не тот ответ
    d.querySelectorAll(".warn").forEach(function (n) { n.remove(); });
    d.querySelector(sel).click();
  }
  function signOut() {
    if (d.querySelector("[data-signout]")) click("[data-signout]");
    return pause(300);
  }

  // 1. вход, если сервера нет
  if (MODE === "down") {
    // Регистрация без сервера создаёт аккаунт на устройстве — это
    // проверяет сценарий offline. А «Войти» откатиться не может: входить
    // некуда, и игра обязана честно об этом сказать.
    fill(USER, "parol123");
    click("[data-login]");
    var login = await waitFor(d, 15000);
    var clear = /сервер не отвечает/i.test(login) &&
      !/failed to fetch/i.test(login);
    log("вход без сервера — сообщение понятное: " + clear, clear);
    log("игрок не попал в аккаунт: " + !/ВЫХОД ВЫПОЛНЕН/.test(login),
      !/ВЫХОД ВЫПОЛНЕН/.test(login));
    out.className = failures ? "bad" : "ok";
    document.title = failures ? "ACCOUNT-FAIL" : "ACCOUNT-OK";
    return;
  }

  fill(USER, "parol123");
  click("[data-register]");
  var e1 = await waitFor(d, 15000);
  log("регистрация нового игрока: " + e1, /ВЫХОД ВЫПОЛНЕН/.test(e1));

  await signOut();
  // 2. неверный пароль
  fill(USER, "nepravilny");
  click("[data-login]");
  var e2 = await waitFor(d, 12000);
  log("неверный пароль: " + e2, /неверн/i.test(e2));

  // 3. верный пароль
  fill(USER, "parol123");
  click("[data-login]");
  var e3 = await waitFor(d, 12000);
  log("верный пароль: " + e3, /ВЫХОД ВЫПОЛНЕН/.test(e3));

  await signOut();
  // 4. занятое имя
  fill(USER, "parol123");
  click("[data-register]");
  var e4 = await waitFor(d, 12000);
  log("занятая почта: " + e4, /уже есть аккаунт|занят/i.test(e4));

  await signOut();
  // 5. короткий пароль
  fill("novy-" + USER, "123");
  click("[data-register]");
  var e5 = await waitFor(d, 12000);
  log("короткий пароль: " + e5, /минимум|парол/i.test(e5));

  // 6. адрес сервера пережил перезагрузку
  var again = await frameReady("../web/index.html");
  var d2 = again.contentDocument;
  d2.querySelector('[data-tab="settings"]').click();
  await pause(300);
  var saved = d2.getElementById("serverUrl");
  log("адрес сервера сохранён: " + (saved && saved.value === URL_),
    !!saved && saved.value === URL_);

  var raw = /failed to fetch/i.test(out.textContent);
  log("техническое «Failed to fetch» не показывается игроку: " + !raw, !raw);

  out.className = failures ? "bad" : "ok";
  document.title = failures ? "ACCOUNT-FAIL" : "ACCOUNT-OK";
})();
</script>
</body>
</html>
