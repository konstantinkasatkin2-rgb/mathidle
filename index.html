<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101420">
<title>Math Idle</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
<meta name="description" content="Math Idle — инкрементальная idle-математическая игра: решай примеры, копи деньги, скушай математику.">
<meta property="og:title" content="Math Idle">
<meta property="og:description" content="Решай примеры и копи деньги. Узелки, счётные палочки и счёты зарабатывают, пока ты играешь.">
<meta property="og:type" content="website">
</head>
<body>
<div id="app">

  <!-- ================= верхняя панель ================= -->
  <header id="topbar">
    <div class="brand">
      <img src="icon.png" alt="" class="brand-icon">
      <div class="brand-text">
        <b>Math Idle</b>
        <small>Решай примеры. Копи деньги.</small>
      </div>
    </div>
    <div class="stat">
      <small>ДЕНЬГИ</small>
      <b class="money" id="money">0</b>
    </div>
    <div class="stat">
      <small>ПАССИВНО КАПАЕТ</small>
      <b class="accent" id="passive">+0/с</b>
      <small id="passiveHint">0 примера/с</small>
    </div>
    <div class="stat">
      <small>МНОЖИТЕЛЬ</small>
      <b class="violet" id="mult">×1.0</b>
      <small id="combo"></small>
    </div>
  </header>

  <!-- ================= основная часть ================= -->
  <main>
    <!-- ---------- пример ---------- -->
    <section id="play">
      <div class="card problem-card">
        <div class="row-between">
          <h2 id="playTitle">Реши пример</h2>
          <span id="playHint" class="hint hidden"></span>
        </div>
        <div id="timerWrap" class="hidden">
          <div class="bar"><i id="timerBar"></i></div>
          <div class="row-between small">
            <span id="timerText"></span>
            <span id="testProgress"></span>
          </div>
        </div>

        <div id="problem" class="problem">…</div>
        <div class="diffbar"><i id="diffBar"></i></div>
        <div class="row-center small"><span id="diffText"></span></div>

        <div id="answer" class="answer"><span id="answerText">…</span><i class="caret"></i></div>
        <div id="floaters"></div>

        <div class="keypad">
          <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
          <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
          <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
          <button data-key="-">−</button><button data-key="0">0</button>
          <button data-key="del" class="wide">DEL</button>
          <button data-key="ok" class="wide primary">OK</button>
        </div>
        <div class="hint-line">Цифры · Backspace — стереть · Enter — ответ</div>
      </div>

      <div id="log"></div>
    </section>

    <!-- ---------- магазин ---------- -->
    <section id="shop">
      <nav class="tabs">
        <button data-tab="upgrades" class="active">Улучшения</button>
        <button data-tab="test">Контрольная</button>
        <button data-tab="grades" id="tabGrades">Магазин</button>
      </nav>
      <div id="panel" class="panel"></div>
    </section>
  </main>

  <!-- ================= модальное окно ================= -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <button id="modalClose">Понятно</button>
    </div>
  </div>

</div>
<script src="balance.js"></script>
<script src="game.js"></script>
</body>
</html>
